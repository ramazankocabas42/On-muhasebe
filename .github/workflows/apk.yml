name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --org com.kones --project-name on_muhasebe --platforms android .
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="on_muhasebe"#android:label="Ön Muhasebe"#' $M

      - name: Sabit imza (güncellemeler üst üste kurulabilsin)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore
          elif [ -f imza/debug.keystore ]; then cp imza/debug.keystore ~/.android/debug.keystore; fi

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ön Muhasebe v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
