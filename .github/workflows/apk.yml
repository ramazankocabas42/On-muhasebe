name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  derle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: |
          if [ ! -d android ]; then
            flutter create --org com.kones --project-name on_muhasebe --platforms android .
          fi
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="on_muhasebe"#android:label="Ön Muhasebe"#' $M
          W=android/gradle/wrapper/gradle-wrapper.properties
          V=$(grep -oE 'gradle-[0-9.]+' $W | head -1)
          echo "Gerekli: $V"
          mkdir -p $HOME/gradle-dl
          Z=$HOME/gradle-dl/$V-bin.zip
          for U in "https://services.gradle.org/distributions/$V-bin.zip" \
                   "https://mirrors.cloud.tencent.com/gradle/$V-bin.zip" \
                   "https://mirrors.huaweicloud.com/gradle/$V-bin.zip" \
                   "https://downloads.gradle.org/distributions/$V-bin.zip"; do
            echo "Deneniyor: $U"
            if curl -fL --retry 3 --retry-delay 5 -o "$Z" "$U" && unzip -tq "$Z" >/dev/null; then
              echo "İndirildi: $U"; break
            fi
            rm -f "$Z"
          done
          test -f "$Z"
          sed -i -E "s#^distributionUrl=.*#distributionUrl=file\\:$Z#" $W
          cat $W

      - name: Sabit imza (güncellemeler üst üste kurulabilsin)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > ~/.android/debug.keystore
          elif [ -f imza/debug.keystore ]; then cp imza/debug.keystore ~/.android/debug.keystore; fi

      - run: flutter pub get
      - name: APK derle (indirme hatasına karşı 3 deneme)
        run: |
          for i in 1 2 3; do
            flutter build apk --release && exit 0
            echo "Deneme $i başarısız, 30 sn sonra tekrar"; sleep 30
          done
          exit 1

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ön Muhasebe v1.0.${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
