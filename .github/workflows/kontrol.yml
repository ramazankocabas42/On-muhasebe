name: Kod Kontrolü

# main dışındaki dallarda ve PR'larda kodu derlemeden denetler (sürüm yayınlamaz).
on:
  push:
    branches-ignore: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Sadece hatalar (error) başarısız sayılır; uyarı ve bilgiler raporlanır.
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos lib
